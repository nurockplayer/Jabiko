name: AI i18n Translation

# Manual, small-batch, PR-only AI-assisted translation of exam content (#378/#400).
# Generates per-locale content overlays (meaning / instruction / context / hint /
# explanation) with Gemini and opens a PR for human review. It never auto-merges,
# never pushes to main, and never touches protected fields (the script only
# adds/merges the `<field>I18n` overlays).
#
# Requires repository secret GEMINI_API_KEY, and (for the PR step) the repo
# setting "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Target locale
        required: true
        default: en
        type: choice
        options: [ja, en, th, id, ko, vi, my]
      level:
        description: JLPT level file to translate
        required: false
        default: "N5"
        type: choice
        options: [N5, N4, N3, N2, N1]
      limit:
        description: Max items to translate this run
        required: false
        default: "10"
      dryRun:
        description: Find targets only -- skip the Gemini call, write and PR
        required: false
        default: true
        type: boolean

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: i18n coverage report
        run: node scripts/check-i18n-coverage.mjs --output .tmp/i18n-coverage.json

      - name: Translate with Gemini (writes overlay unless dry-run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/ai-translate-content.mjs \
            --locale "${{ inputs.locale }}" \
            --level "${{ inputs.level }}" \
            --limit "${{ inputs.limit }}" \
            --source-report .tmp/i18n-coverage.json \
            --summary .tmp/i18n-summary.md \
            ${{ inputs.dryRun == true && '--dry-run' || '' }}

      # Verify the generated overlay compiles + passes the suite before any PR.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Create pull request
        if: ${{ inputs.dryRun == false }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ai/i18n-${{ inputs.locale }}-${{ inputs.level }}-${{ github.run_id }}
          title: "i18n: ${{ inputs.locale }} ${{ inputs.level }} content translations (Gemini)"
          commit-message: "i18n: add ${{ inputs.locale }} ${{ inputs.level }} content overlays (Gemini)"
          body-path: .tmp/i18n-summary.md
          add-paths: src/domain/exam/items/*.ts
          labels: i18n, ai-generated
          draft: false
