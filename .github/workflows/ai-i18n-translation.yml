name: AI i18n Translation

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Target locale
        required: true
        default: en
        type: choice
        options:
          - ja
          - en
          - th
          - id
          - ko
          - vi
          - my
      level:
        description: Optional JLPT level filter (N5-N1, or empty for all)
        required: false
        default: ""
      limit:
        description: Max items to translate
        required: false
        default: "10"
      dryRun:
        description: Do not create PR (scan + translate only)
        required: false
        default: true
        type: boolean

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n coverage
        run: node scripts/check-i18n-coverage.mjs --output .tmp/i18n-coverage.json

      - name: Translate missing content with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEVEL: ${{ inputs.level }}
          LOCALE: ${{ inputs.locale }}
          LIMIT: ${{ inputs.limit }}
        run: |
          LEVEL_ARG=""
          if [ -n "$LEVEL" ]; then
            LEVEL_ARG="--level $LEVEL"
          fi
          node scripts/ai-translate-content.mjs \
            --locale "$LOCALE" \
            $LEVEL_ARG \
            --limit "$LIMIT" \
            --source-report .tmp/i18n-coverage.json

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Create pull request
        if: ${{ inputs.dryRun == false }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: ai/i18n-${{ inputs.locale }}-${{ github.run_id }}
          title: "i18n: add ${{ inputs.locale }} translations"
          commit-message: "i18n: add ${{ inputs.locale }} translations"
          body: |
            ## AI-assisted i18n translation

            Generated by the AI i18n Translation workflow using Gemini.

            **Scope:**
            - Locale: `${{ inputs.locale }}`
            - Level: `${{ inputs.level || "all" }}`
            - Limit: `${{ inputs.limit }}`

            **Please review translation quality before merging.**

            ### Review checklist
            - [ ] Translations are natural and idiomatic (not literal word-for-word)
            - [ ] Japanese vocabulary, readings, and example sentences are preserved verbatim
            - [ ] No protected fields (answers, readings, levels, IDs) were modified
            - [ ] Technical terms are correctly translated for language learners
