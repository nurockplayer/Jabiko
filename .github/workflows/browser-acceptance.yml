name: Chromium navigation acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: jabiko-heavy-validation
  queue: max
  cancel-in-progress: false

jobs:
  navigation:
    name: Chromium navigation acceptance
    runs-on: ubuntu-latest
    # Preserve the original 20-minute validation budget plus the 16-minute gate.
    timeout-minutes: 36

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Cloudflare deployment before validation
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/wait-cloudflare-check.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run navigation browser acceptance
        run: pnpm test:browser:navigation

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-browser-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
