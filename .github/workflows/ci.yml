name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # #315: pnpm is the only package manager. Consistency with package.json
      # is already enforced by --frozen-lockfile below; this step blocks a
      # foreign lockfile from ever landing in the repo (agents occasionally
      # run npm/yarn by habit).
      - name: Lockfile guard (pnpm only)
        run: |
          if ls package-lock.json yarn.lock bun.lockb bun.lock npm-shrinkwrap.json 2>/dev/null | grep -q .; then
            echo "::error::Foreign lockfile detected — pnpm-lock.yaml is the only allowed lockfile. Remove npm/yarn/bun lockfiles."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Invoke the test files directly (glob), not the directory. `node --test
      # <dir>` resolves test/index.js as a directory entrypoint whose nested
      # `node --test` hits a Node 22 test-runner IPC bug ("Unable to deserialize
      # cloned data") that flakes the run. The glob runs each .test.mjs file
      # directly and is reliable on the pinned Node 22.
      - name: Analytics contract tests
        run: node --test ops/analytics/test/*.test.mjs

      - name: Lint (eslint, zero warnings)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check exam bank (hint leaks / answer-in-options / level labels)
        run: pnpm check:exam

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Diff whitespace check (latest PR commit)
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^ HEAD
